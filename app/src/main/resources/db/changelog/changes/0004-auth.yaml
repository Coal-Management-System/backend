databaseChangeLog:
  - changeSet:
      id: 0004-app-user
      author: jemsit
      changes:
        - createTable:
            tableName: app_user
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz }
              - column: { name: username, type: "varchar(50)", constraints: { nullable: false, unique: true } }
              - column: { name: password_hash, type: "varchar(100)", constraints: { nullable: false } }
              - column: { name: full_name, type: "varchar(120)", constraints: { nullable: false } }
              - column: { name: role, type: "varchar(20)", constraints: { nullable: false } }
              - column: { name: shift, type: "varchar(10)", constraints: { nullable: false } }

  - changeSet:
      id: 0004-auth-session
      author: jemsit
      changes:
        - createTable:
            tableName: auth_session
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz }
              - column: { name: token, type: "varchar(64)", constraints: { nullable: false, unique: true } }
              - column: { name: user_id, type: uuid, constraints: { nullable: false } }
              - column: { name: expires_at, type: timestamptz, constraints: { nullable: false } }
        - addForeignKeyConstraint:
            baseTableName: auth_session
            baseColumnNames: user_id
            referencedTableName: app_user
            referencedColumnNames: id
            constraintName: fk_auth_session_user

