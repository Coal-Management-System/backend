databaseChangeLog:
  # A printable QR code that asks an operator to do something, as opposed to the read-only
  # passport codes. It means nothing without its party and warehouse, so it goes with them.
  - changeSet:
      id: 0008-qr-action
      author: jemsit
      changes:
        - createTable:
            tableName: qr_action
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: created_at, type: timestamptz, constraints: { nullable: false } }
              - column: { name: updated_at, type: timestamptz }
              - column: { name: action, type: "varchar(40)", constraints: { nullable: false } }
              - column: { name: batch_id, type: uuid, constraints: { nullable: false } }
              - column: { name: warehouse_id, type: uuid, constraints: { nullable: false } }
              - column: { name: cancelled_at, type: timestamptz }
        - addForeignKeyConstraint:
            baseTableName: qr_action
            baseColumnNames: batch_id
            referencedTableName: coal_batch
            referencedColumnNames: id
            constraintName: fk_qr_action_batch
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: qr_action
            baseColumnNames: warehouse_id
            referencedTableName: warehouse
            referencedColumnNames: id
            constraintName: fk_qr_action_warehouse
            onDelete: CASCADE
