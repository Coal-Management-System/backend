databaseChangeLog:
  # MANAGER and USER are replaced by the spec roles (section 20 «Права доступа»).
  - changeSet:
      id: 0009-migrate-legacy-roles
      author: jemsit
      changes:
        - update:
            tableName: app_user
            columns:
              - column: { name: role, value: "PRODUCTION_HEAD" }
            where: "role = 'MANAGER'"
        - update:
            tableName: app_user
            columns:
              - column: { name: role, value: "DISPATCHER" }
            where: "role = 'USER'"

  # One local-development account per new role. Password is the username followed by 123.
  - changeSet:
      id: 0009-seed-role-users
      author: jemsit
