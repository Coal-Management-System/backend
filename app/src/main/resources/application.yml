spring:
  application:
    name: coal-transport
  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
  datasource:
    url: jdbc:postgresql://localhost:5432/coal
    username: coal
    password: coal
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

coal:
  admin:
    # Key required to delete batches (X-Admin-Key header). Empty disables deletion.
    delete-key: ${COAL_ADMIN_DELETE_KEY:tetris}
  qr:
    base-url: http://localhost:5174
  quality:
    max-ash: 20
    max-moisture: 12
  cors:
    # Comma-separated. Override with COAL_CORS_ALLOWED_ORIGINS. Only matters when
    # the SPA is served from a different origin than the API; a same-origin
    # deployment (nginx proxying /api) never issues a cross-origin request.
    allowed-origins: http://localhost:5174
